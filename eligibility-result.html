    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { max-width: 100%; overflow-x: hidden; }
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: #EFF6FF; color: #1F2937; -webkit-font-smoothing: antialiased; }
        .container { width: 100%; margin-left: auto; margin-right: auto; padding-left: 1rem; padding-right: 1rem; }
        @media (min-width: 640px) { .container { max-width: 640px; padding-left: 1.5rem; padding-right: 1.5rem; } }
        @media (min-width: 768px) { .container { max-width: 768px; } }
        @media (min-width: 1024px) { .container { max-width: 900px; padding-left: 2rem; padding-right: 2rem; } }
        .navbar { background-color: #ffffff; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .navbar-container { display: flex; justify-content: space-between; align-items: center; height: 5rem; gap: 1rem; }
        .navbar-logo { height: 45px; max-width: 210px; width: auto; object-fit: contain; flex-shrink: 0; }
        .result-wrapper { padding: 3rem 0 5rem 0; }
        .result-card { background: #fff; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); text-align: center; border-top: 6px solid #1D4ED8; }
        .result-card h1 { font-size: 1.75rem; font-weight: 800; margin: 0 0 1rem 0; }
        .result-card p { font-size: 1.125rem; line-height: 1.6; color: #374151; }
        .result-card ul { text-align: left; padding-left: 1.5rem; margin-bottom: 1.5rem; line-height: 1.6; }
        .result-card ul li { margin-bottom: 0.5rem; font-weight: 500; }
        .result-qualified { border-top-color: #16A34A; background-color: #F0FDF4; }
        .result-qualified h1 { color: #166534; }
        .result-more-info { border-top-color: #EAB308; background-color: #FEFCE8; }
        .result-more-info h1, .result-more-info p, .result-more-info ul { color: #854D0E; }
        .result-not-qualified { border-top-color: #DC2626; background-color: #FEF2F2; }
        .result-not-qualified h1, .result-not-qualified p, .result-not-qualified ul { color: #991B1B; }
        .btn { display: inline-flex; justify-content: center; align-items: center; border-radius: 0.5rem; font-weight: 600; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: transform 0.2s, background-color 0.2s; text-decoration: none; cursor: pointer; border: none; text-align: center; }
        .btn:hover { transform: scale(1.03); }
        .btn-green { background-color: #10B981; color: #ffffff; padding: 1rem 2rem; font-size: 1.125rem; width: 100%; }
        .btn-green:hover { background-color: #059669; }
        .btn-amber { background-color: #f59e0b; color: #ffffff; padding: 1rem 2rem; font-size: 1.125rem; width: 100%; }

        .btn-outline { background-color: transparent; border: 2px solid #2563EB; color: #2563EB; padding: 0.75rem 1.5rem; font-weight: 600; display: inline-block; margin-top: 1rem; }
        .btn-outline:hover { background-color: #EFF6FF; }
        .credit-badge { color: #059669; font-weight: 700; font-size: 0.95rem; background-color: #D1FAE5; padding: 0.5rem 1rem; border-radius: 0.5rem; display: inline-block; margin-top: 1rem; }
        .back-link { display: inline-block; margin-top: 1.5rem; color: #2563EB; font-size: 0.95rem; text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }

<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NWVCKXZN" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <nav class="navbar">
        <div class="container navbar-container">
            <a href="/" title="Colombian Passport Home">
                <img src="logo.png" alt="ColombianPassport.com Logo" class="navbar-logo" onerror="this.onerror=null;this.src='https://placehold.co/200x50/0056b3/FFFFFF?text=ColombianPassport.com';">
            </a>
        </div>
    </nav>

    <main class="container result-wrapper">
        <div id="resultCard" class="result-card">
            <h1>Cargando tu resultado...</h1>
            <p>Un momento, por favor.</p>
        </div>
        <div style="text-align:center;">
            <a class="back-link" href="/#form-section">&larr; Volver al verificador</a>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p style="margin:0;">&copy; <span id="currentYear"></span> ColombianPassport.com. Todos los derechos reservados. &middot; <a href="https://www.colombianpassport.com/privacy-policy" target="_blank">Política de privacidad</a></p>
        </div>
    </footer>

    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        (function () {
            var params = new URLSearchParams(window.location.search);
            var status = (params.get('status') || '').toLowerCase().trim();

            if (status === 'eligible') status = 'qualified';
            if (status === 'more_info_needed' || status === 'more-info-needed' || status === 'review') status = 'more-info';
            if (status === 'not_qualified' || status === 'notqualified') status = 'not-qualified';

            var stored = null;
            try {
                stored = JSON.parse(sessionStorage.getItem('residentVisaResult') || 'null');
            } catch (e) { stored = null; }

            if (!status && stored && stored.status) status = stored.status;

            var messages = (stored && stored.messages) || [];
            var needsTraspaso = stored && stored.needsTraspaso;

            var card = document.getElementById('resultCard');
            var content = '';
            var pageTitle = '';

            if (status === 'qualified') {
                card.className = 'result-card result-qualified';
                pageTitle = 'Cumples los requisitos básicos | Visa de Residente Colombia';
                var route = needsTraspaso
                    ? '<p style="color:#15803d;font-weight:700;">Tu ruta: TRASPASO de Residente (estudio $56 + traspaso $56 + cédula $294.000 COP). Plazo máximo: 31 de octubre de 2026.</p>'
                    : '<p style="color:#15803d;font-weight:700;">Tu ruta: primera visa R por TIEMPO ACUMULADO (estudio $56 + expedición $408 + cédula $294.000 COP).</p>';
                content = ''
                    + '<h1>¡Buenas noticias! Cumples los requisitos básicos. 💍</h1>'
                    + route
                    + '<p style="color:#15803d;font-weight:500;">Pero el verdadero reto no es el rechazo: es la burocracia que puede quemar tus tiempos y frenar tu cédula.</p>'
                    + '<ul style="color:#166534;list-style:decimal;">'
                    + '<li>Pelear con la plataforma SITAC, inestable y confusa.</li>'
                    + '<li>Recibir un ‘requerimiento’ incomprensible o una ‘inadmisión’.</li>'
                    + '<li>El estrés de cazar una cita de cédula mientras el sistema se cae.</li>'
                    + '</ul>'
                    + '<p style="color:#14532d;font-weight:700;">No dejes que el papeleo ponga en riesgo años de residencia.</p>'
                    + '<p style="color:#166534;font-size:1rem;">Reserva tu consulta estratégica de $80 USD y dejemos el sistema en nuestras manos.</p>'
                    + '<p><span class="credit-badge">✨ Los $80 se abonan al 100% al plan que contrates.</span></p>'
                    + '<div style="margin-top:1.5rem;"><a href="https://calendar.app.google/PS9iqxJNidkL6LnV7" target="_blank" class="btn btn-green">Reservar consulta de $80</a></div>';
            } else if (status === 'more-info') {
                card.className = 'result-card result-more-info';
                pageTitle = 'Tu caso necesita revisión | Visa de Residente Colombia';
                var items = messages.length
                    ? messages.map(function (m) { return '<li>' + m.replace(/</g, '&lt;') + '</li>'; }).join('')
                    : '<li>Tus respuestas indican puntos que necesitan revisión experta antes de continuar.</li>';
                content = ''
                    + '<h1>Gracias. Tu caso requiere atención especial.</h1>'
                    + '<p>Según tus respuestas, hay puntos que un experto debe revisar antes de continuar:</p>'
                    + '<ul>' + items + '</ul>'
                    + '<p style="font-weight:600;">Reserva tu consulta estratégica para analizar tu situación en detalle y definir la mejor ruta legal.</p>'
                    + '<a href="https://calendar.app.google/PS9iqxJNidkL6LnV7" target="_blank" class="btn btn-amber">Reservar consulta de $80</a>';
            } else if (status === 'not-qualified') {
                card.className = 'result-card result-not-qualified';
                pageTitle = 'Información importante sobre tu caso | Visa de Residente Colombia';
                var itemsNQ = messages.length
                    ? messages.map(function (m) { return '<li>' + m.replace(/</g, '&lt;') + '</li>'; }).join('')
                    : '<li>Tus respuestas no cumplen los requisitos fundamentales de la visa de Residente.</li>';
                content = ''
                    + '<h1>Información importante sobre tu caso</h1>'
                    + '<p>Gracias por tus respuestas. Identificamos puntos que no cumplen los requisitos fundamentales de la visa de Residente:</p>'
                    + '<ul>' + itemsNQ + '</ul>'
                    + '<p>Si tu situación cambia o crees que hubo un malentendido, explora otras opciones de visa con nosotros.</p>'
                    + '<a href="https://www.abogadosdemigracion.com.co" target="_blank" class="btn btn-outline" style="border-color:#991B1B;color:#991B1B;">Explorar otras visas</a>';
            } else {
                card.className = 'result-card';
                pageTitle = 'Verifica tu elegibilidad | Visa de Residente Colombia';
                content = ''
                    + '<h1>Primero completa el verificador</h1>'
                    + '<p>No encontramos tus respuestas. Vuelve y responde las preguntas rápidas para mostrarte tu resultado personalizado.</p>'
                    + '<div style="margin-top:1.5rem;"><a href="/#form-section" class="btn btn-green" style="background-color:#2563EB;">Ir al verificador</a></div>';
            }

            card.innerHTML = content;
            if (pageTitle) document.title = pageTitle;

            window.dataLayer = window.dataLayer || [];
            if (status === 'qualified' || status === 'more-info' || status === 'not-qualified') {
                window.dataLayer.push({
                    event: 'eligibility_result_view',
                    eligibility_status: status
                });
            }
        })();
    </script>
</body>
